<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title or "Fantasy Intelligence" }}</title>
<style>:root{--navy:#172554;--blue:#0759c7;--page:#f4f6f9;--text:#172033;--line:#e4e8ef}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font-family:Arial,Helvetica,sans-serif}.site-shell{max-width:1700px;margin:auto;padding:0 14px 30px}.topbar{position:sticky;top:0;z-index:1100;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(15,23,42,.06);margin-bottom:18px}.topbar-inner{max-width:1700px;margin:auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:900;color:var(--navy);text-decoration:none;white-space:nowrap}.nav{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.nav a,.admin summary{color:var(--blue);font-weight:700;text-decoration:none;padding:9px 10px;border-radius:7px;cursor:pointer}.nav a:hover,.admin summary:hover{background:#eef4ff}.admin{position:relative}.admin-menu{display:none;position:absolute;right:0;top:42px;min-width:190px;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:7px}.admin[open] .admin-menu{display:block}.admin-menu a{display:block}@media(max-width:900px){.topbar{position:static}.topbar-inner{align-items:flex-start;flex-direction:column}.admin-menu{position:static;box-shadow:none}}</style><link rel="stylesheet" href="{{ url_for('static', filename='pickem_inputs.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='pickem_feed.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='market_intelligence.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='survivor_intelligence.css') }}"></head>
<body><header class="topbar"><div class="topbar-inner"><a class="brand" href="{{ url_for('dashboard') }}">🏈 Fantasy Intelligence</a><nav class="nav" aria-label="Primary navigation"><div class="nav-group"><a href="{{ url_for('dashboard') }}">Command Center</a><a href="{{ url_for('owner_ops.team_page') }}">My Team</a><a href="{{ url_for('owner_ops.waivers_page') }}">Waivers</a><a href="{{ url_for('owner_ops.trades_page') }}">Trades</a><a href="{{ url_for('survivor.home') }}">Survivor</a><a href="{{ url_for('nfl_intelligence.home') }}">NFL Intelligence</a><a href="{{ url_for('owner_ops.team_page') }}#changes">Team Changes</a></div><details class="admin nav-group nav-menu"><summary>Season Planning</summary><div class="admin-menu"><a href="{{ url_for('draftboard') }}">Draft Board</a><a href="{{ url_for('mock_draft_lab') }}">Mock Draft</a></div></details><details class="admin nav-group nav-menu"><summary>Admin</summary><div class="admin-menu"><a href="{{ url_for('sleeper_hub.home') }}">Sleeper Hub</a><a href="{{ url_for('draft_health.home') }}">Draft Day Readiness</a><a href="{{ url_for('draft_accuracy.home') }}">Draft Intelligence &amp; Learning Center</a><a href="{{ url_for('imports') }}">Imports</a><a href="{{ url_for('draft_health.home') }}">Readiness</a><a href="{{ url_for('intelligence_operations.health') }}">Diagnostics</a></div></details></nav></div></header><main class="site-shell">{% block content %}{% endblock %}</main></body></html>
