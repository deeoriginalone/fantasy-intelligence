<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or "Fantasy Intelligence" }}</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin:0; padding:40px; background:#f5f5f5; color:#222; }
        h1 { margin-top:0; }
        nav { background:white; padding:15px 20px; border-radius:10px; margin-bottom:20px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
        nav a { display:inline-block; margin-right:20px; padding:6px 0; color:#1565c0; text-decoration:none; font-weight:bold; }
        nav a:hover { text-decoration:underline; }
        .card { background:white; padding:20px; border-radius:10px; margin-bottom:20px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
        @media (max-width:800px) { body { padding:18px; } nav a { display:block; margin:0 0 6px; } }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <h1>{{ title or "Fantasy Intelligence" }}</h1>
    <nav>
        <a href="/">Dashboard</a>
        <a href="/predraft">Predraft Lab</a>
        <a href="/imports">Imports</a>
        <a href="/agents">Agents</a>
        <a href="/draftcenter">Draft Center</a>
        <a href="/draftboard">My Draft Board</a>
        <a href="/league">League</a>
        <a href="/rosters">League Rosters</a>
        <a href="/trackdraft">Draft Tracker</a>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
