{% extends "base.html" %}

{% block content %}

<h2>Sleeper League Teams</h2>

<table>
    <tr>
        <th>Display Name</th>
        <th>Team Name</th>
        <th>Owner</th>
    </tr>

    {% for team in teams %}
    <tr>
        <td>{{ team[0] }}</td>
        <td>{{ team[1] }}</td>
        <td>{{ team[2] }}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
